name: wf-docs

# Reusable: documents, runbooks and safety-case evidence.
on:
  workflow_call:
    inputs:
      check-evidence: {type: boolean, default: false}   # true in terra-safety-case
    secrets:
      WIF_PROVIDER: {required: false}
      WIF_SERVICE_ACCOUNT: {required: false}

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v16
        with: {globs: "**/*.md"}
      - uses: lycheeverse/lychee-action@v2
        with: {args: "--no-progress --exclude-mail ."}

  test:
    name: ci / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mermaid diagrams render
        run: npx -y @mermaid-js/mermaid-cli -i README.md -o /tmp/out.md || true

  evidence:
    name: safety / evidence-link
    if: inputs.check-evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml
      - name: Every claim resolves to an artifact with a matching hash
        run: ./tools/check-evidence.py --claims claims/ --index evidence/index.yaml --resolve
