name: wf-terraform

# Reusable: fmt/validate/lint/policy on every PR, plan posted as a comment,
# apply only from main behind an environment approval.
on:
  workflow_call:
    inputs:
      working-directory: {type: string, required: true}   # envs/dev | envs/staging | envs/prod
      environment:       {type: string, required: true}
      terraform-version: {type: string, default: "1.9.8"}
      apply:             {type: boolean, default: false}
    secrets:
      WIF_PROVIDER: {required: true}
      WIF_SERVICE_ACCOUNT: {required: true}

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  plan:
    name: terraform / plan
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults: {run: {working-directory: "${{ inputs.working-directory }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "${{ inputs.terraform-version }}"}
      - name: terraform / fmt
        run: terraform fmt -check -recursive
      - run: terraform init -input=false
      - name: terraform / validate
        run: terraform validate
      - name: terraform / checkov
        uses: bridgecrewio/checkov-action@master
        with: {directory: "${{ inputs.working-directory }}", quiet: true, soft_fail: false}
      - run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt
      - name: Comment the plan
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ inputs.working-directory }}/plan.txt','utf8');
            const body = `### terraform plan · \`${{ inputs.environment }}\`\n\n<details><summary>expand</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
      - uses: actions/upload-artifact@v4
        with: {name: "tfplan-${{ inputs.environment }}", path: "${{ inputs.working-directory }}/tfplan", retention-days: 7}

  apply:
    name: terraform / apply
    needs: plan
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}    # reviewers gate here
    defaults: {run: {working-directory: "${{ inputs.working-directory }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v3
        with: {terraform_version: "${{ inputs.terraform-version }}"}
      - uses: actions/download-artifact@v4
        with: {name: "tfplan-${{ inputs.environment }}", path: "${{ inputs.working-directory }}"}
      - run: terraform init -input=false
      - run: terraform apply -input=false -auto-approve tfplan
