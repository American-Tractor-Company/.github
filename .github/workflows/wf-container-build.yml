name: wf-container-build

# Reusable: build, scan, sign and publish a container to Artifact Registry via WIF.
# No service-account keys anywhere — identity is federated from the repo+environment.
on:
  workflow_call:
    inputs:
      image:        {type: string, required: true}   # e.g. terra-data-decode
      context:      {type: string, default: "."}
      dockerfile:   {type: string, default: "Dockerfile"}
      environment:  {type: string, default: "dev"}
      project:      {type: string, default: "atc-terra-serving"}
      region:       {type: string, default: "us-central1"}
      push:         {type: boolean, default: true}
    secrets:
      WIF_PROVIDER: {required: true}
      WIF_SERVICE_ACCOUNT: {required: true}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: ci / container
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      REGISTRY: ${{ inputs.region }}-docker.pkg.dev/${{ inputs.project }}/terra
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev --quiet
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: ${{ inputs.push }}
          tags: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ inputs.image }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Sign (keyless, Fulcio) and attest
        if: inputs.push
        run: |
          cosign sign --yes "${REGISTRY}/${{ inputs.image }}@${{ steps.build.outputs.digest }}"
          gcloud container binauthz attestations sign-and-create \
            --artifact-url="${REGISTRY}/${{ inputs.image }}@${{ steps.build.outputs.digest }}" \
            --attestor=terra-build --attestor-project=${{ inputs.project }} \
            --keyversion-project=${{ inputs.project }} --keyversion-location=${{ inputs.region }} \
            --keyversion-keyring=terra --keyversion-key=binauthz --keyversion=1
