name: wf-assets-lint

# Reusable: keep large binaries out of git and keep assets.lock honest.
on:
  workflow_call:
    inputs:
      lockfile:   {type: string, default: "assets.lock"}
      max-blob-mb: {type: number, default: 5}
    secrets:
      WIF_PROVIDER: {required: false}
      WIF_SERVICE_ACCOUNT: {required: false}

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: ci / lint
    runs-on: ubuntu-latest
    env:
      HAS_WIF: ${{ secrets.WIF_PROVIDER != '' }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: No blob over ${{ inputs.max-blob-mb }} MB
        run: |
          limit=$(( ${{ inputs.max-blob-mb }} * 1024 * 1024 ))
          fail=0
          while read -r size path; do
            [ "$size" -gt "$limit" ] && { echo "::error file=$path::$((size/1048576)) MB — put it behind ${{ inputs.lockfile }}"; fail=1; }
          done < <(git rev-list --objects HEAD | git cat-file --batch-check='%(objecttype) %(objectsize) %(rest)' | awk '$1=="blob" && $3!="" {print $2" "$3}')
          exit $fail
      - uses: google-github-actions/auth@v2
        if: env.HAS_WIF == 'true'
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
      - name: Verify every asset in ${{ inputs.lockfile }} resolves and hashes
        run: ./tools/assets.py verify --lock "${{ inputs.lockfile }}"

  usd:
    name: ci / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate USD layers and scenario definitions
        run: ./tools/validate-usd.py stages/ && ./tools/validate-scenarios.py scenarios/
