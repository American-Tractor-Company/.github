name: wf-security

# Reusable: the same security floor in every repo.
on:
  workflow_call:
    inputs:
      languages: {type: string, default: '["python","javascript"]'}   # JSON array of CodeQL languages

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: security / codeql
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: {languages: "${{ matrix.language }}"}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  gitleaks:
    name: security / gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan full history with the gitleaks CLI (no license needed)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --no-banner --redact --exit-code 1

  deps:
    name: security / dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, SSPL-1.0
